<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <style>
    body{font-family:system-ui,"Hiragino Sans","Yu Gothic UI",sans-serif;width:280px;margin:0;padding:14px;font-size:13px;color:#1f2328;background:#fff}
    h1{font-size:15px;margin:0 0 10px}
    label{display:flex;align-items:center;gap:8px;margin-bottom:12px;cursor:pointer}
    h2{font-size:12px;color:#57606a;margin:12px 0 4px}
    ul{list-style:none;padding:0;margin:0}
    li{display:flex;justify-content:space-between;align-items:center;padding:3px 0}
    li button{font-size:11px;cursor:pointer}
    .empty{color:#8c959f}
    @media (prefers-color-scheme: dark){body{background:#161b22;color:#e6edf3}h2{color:#8d96a0}}
  </style>
</head>
<body>
  <h1>英語ページ自動翻訳</h1>
  <label><input type="checkbox" id="enabled"> 英語ページで確認を表示する</label>
  <h2>常に翻訳するサイト</h2>
  <ul id="alwaysSites"></ul>
  <h2>確認を出さないサイト</h2>
  <ul id="neverSites"></ul>
  <script src="popup.js"></script>
</body>
</html>
